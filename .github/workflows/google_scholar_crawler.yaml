name: Get Citation Data

on:
 push:
  branches:
   - main
 schedule:
  - cron: '0 8 * * *'
 workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Check out website source
      uses: actions/checkout@v4
      with:
        path: source

    - name: Check out existing citation data
      uses: actions/checkout@v4
      with:
        ref: google-scholar-stats
        path: citation-data

    - name: Fetch Google Scholar data
      working-directory: source
      run: python3 google_scholar_crawler/main.py --output-dir ../citation-data
      env:
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}

    - name: Publish updated citation data
      working-directory: citation-data
      shell: bash
      run: |
        git config --local user.name "${GITHUB_ACTOR}"
        git config --local user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
        git add *.json
        if git diff --cached --quiet; then
          echo "Citation data is unchanged."
          exit 0
        fi
        git commit -m "Update citation data"
        git push origin HEAD:google-scholar-stats
